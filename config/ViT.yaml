base: &base

  # Model config
  embed_dim: 512
  depth: 12
  dropout: 0.0
  patch_size: 32
  num_heads: 16
  model_backend: 'pytorch'

  # Training config
  img_size: [4096, 4096]
  dt: 1
  global_batch_size: 4 # number of samples per training batch
  num_iters: 30000
  amp_mode: none
  enable_fused: false
  enable_jit: false
  activation_checkpoint: false
  expdir: '/logs'
  lr_schedule: 'cosine'
  lr: 5E-4
  warmup: 0
  optimizer: 'Adam'

  # Data
  data_loader_config: 'pytorch'
  num_data_workers: 0 # number of dataloader worker threads per proc
  spatial_read_mode: 'all' # choices: local, all
  n_in_channels: 2
  n_out_channels: 2
  data_path: '/data'
  stats_path: '/data/stats_trajectory.h5'
  limit_nsamples: None
  limit_nsamples_val: None

  # Comms
  wireup_info: env
  wireup_store: tcp

# limit the number of samples
short: &short_ls
  <<: *base
  limit_nsamples: 64
  limit_nsamples_val: 16
  num_iters: 80

# add optimization flags
short_opt:
  <<: *short_ls
  data_loader_config: 'pytorch'
  num_data_workers: 2
  amp_mode: bf16
  enable_jit: true
  enable_fused: true

short_opt_dali: &short_opt_dali
  <<: *short_ls
  data_loader_config: 'dali'
  num_data_workers: 2
  amp_mode: bf16
  enable_jit: true
  enable_fused: true

short_opt_dali_dp:
  <<: *short_opt_dali
  global_batch_size: 16

short_opt_big: &short_opt_big
  <<: *short_ls
  global_batch_size: 4
  data_loader_config: 'dali'
  num_data_workers: 2
  amp_mode: bf16
  enable_jit: true
  enable_fused: true
  patch_size: 16
  embed_dim: 1024

# lr = 5e-4 * sqrt(16 / 4) = 1e-3.
short_opt_big_dp16:
  <<: *short_opt_big
  global_batch_size: 16
  lr: 1.0E-3

# no samples limits
opt_big: &opt_big
  <<: *short_opt_big
  num_iters: 30000

# Model parallel configs
short_mp: &short_mp
  <<: *short_opt_big
  global_batch_size: 4
  num_data_workers: 2
  patch_size: 16
  embed_dim: 1536
  num_heads: 24
  depth: 16
  data_loader_config: 'dali'
  amp_mode: bf16
  enable_jit: false
  enable_fused: true

short_mp_te: &short_mp_te
  <<: *short_mp
  model_backend: 'transformer-engine'
  enable_jit: false
  enable_fused: true

short_mp_ckpt:
  <<: *short_mp
  activation_checkpoint: true
