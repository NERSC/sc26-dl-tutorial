base: &base

  # Model config
  network: 'fno'
  embed_dim: 16 # hidden channels; activations scale with it at full resolution, see networks/plans/fno/analysis.md
  depth: 4
  dropout: 0.0
  modes_kh: 64 # retained wavenumbers in h, after truncation (None: all)
  modes_kw: 64 # retained wavenumbers in w
  mlp_ratio: 2.0 # hidden width of the channel MLP in each block, 0 disables it
  spectral_init_k0: 8.0 # scale the initial spectral weights by 1/(1+(k/k0)^2), k in grid-index units; None disables
  downsample: 1 # Fourier downsampling factor per axis: the blocks run on a latent grid this many times coarser, which divides their activation memory by downsample^2
  lift_dim: None # channels of the full-grid lift and projection when downsampling (None: 16); embed_dim without downsampling
  resample_skip: true # add the full-grid lift features back after the upsampling: they carry the wavenumbers the latent grid cannot represent
  model_backend: 'pytorch'

  # Training config
  img_size: [4096, 4096]
  dt: 1
  global_batch_size: 1 # one 4096x4096 sample needs ~20 GB at embed_dim 16, the mp config uses 8 over 16 GPUs
  num_iters: 30000
  amp_mode: none # none or bf16; not fp16: its loss scaling cannot unscale the complex spectral weights
  enable_fused: false # fused Adam does not support the complex spectral weights
  enable_jit: false
  expdir: '/logs'
  lr_schedule: 'cosine'
  lr: 5E-4
  warmup: 0
  optimizer: 'Adam'

  # Data
  data_loader_config: 'pytorch'
  num_data_workers: 0 # number of dataloader worker threads per proc
  spatial_read_mode: 'local' # choices: local (read only this rank's tile), all (read the full image, then slice)
  n_in_channels: 2
  n_out_channels: 2
  data_path: '/data'
  stats_path: '/data/stats_trajectory.h5'
  limit_nsamples: None
  limit_nsamples_val: None

  # Comms
  wireup_info: env
  wireup_store: tcp

# limit the number of samples
short: &short_ls
  <<: *base
  limit_nsamples: 512
  limit_nsamples_val: 128
  num_iters: 128

# add optimization flags
short_opt:
  <<: *short_ls
  data_loader_config: 'dali'
  num_data_workers: 8
  amp_mode: bf16
  enable_jit: true
  enable_fused: false

# no samples limits
opt: &opt
  <<: *base
  data_loader_config: 'dali'
  num_data_workers: 8
  amp_mode: bf16
  num_iters: 30000
  enable_jit: true
  enable_fused: false

# Model parallel configs
mp: &mp
  <<: *base
  num_iters: 30000
  global_batch_size: 8 # 16 ran out of 40 GB on 16 GPUs: ~23 GB of activations per GPU plus ~10 GB of buffers and NCCL/cuFFT memory
  lr: 1e-3
  num_data_workers: 2
  data_loader_config: 'dali'
  amp_mode: bf16
  enable_jit: false
  enable_fused: false

# Fourier downsampling by 2 per axis: the blocks run on 4x fewer grid points, so 4x the channels fit at about the same memory
mp_resample:
  <<: *mp
  embed_dim: 64
  downsample: 2
  lift_dim: 16

# Parameter-matched to the ViT base config (embed_dim 512, depth 12, patch 32: 48.3M parameters). Downsampling by 2 per axis,
# modes 32x32 and embed_dim 76 give 47.4M real parameters (a complex weight counts as two); almost all of them are the
# spectral weights, 2 * embed_dim^2 * modes_kh * modes_kw per block (the ViT's are in its attention and MLP matrices).
# Equal parameter counts do not mean equal cost: the FNO spends its FLOPs on FFTs at the latent grid.
mp_vit_matched:
  <<: *mp
  embed_dim: 76
  depth: 4
  downsample: 2
  lift_dim: 16
  modes_kh: 32
  modes_kw: 32

# 2048 channels. The blocks run on a 4x coarser grid per axis (1024x1024 for the 4096x4096 images): 2048 channels on a
# 2x coarser grid do not fit 40 GB per GPU at 16 GPUs. The spectral weights scale as embed_dim^2 * modes_kh * modes_kw,
# so the retained modes are few. Launch on 16 GPUs with --tp=1 --sp1=4 --sp2=4 (tp does not pay here, see the plan).
embed_large:
  <<: *mp
  embed_dim: 2048
  downsample: 4
  lift_dim: 32
  modes_kh: 16
  modes_kw: 16
  global_batch_size: 1
