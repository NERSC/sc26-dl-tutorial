base: &base

  # Model config
  network: 'fno'
  # Parameter-matched to the ViT base (embed_dim 512, depth 12, patch 32: 48.3M).
  # embed 76, depth 4, modes 32x32: 47.4M real parameters. A complex spectral weight counts as two.
  embed_dim: 76
  depth: 8
  dropout: 0.0
  modes_kh: 32 # retained wavenumbers in h, after truncation (None: all)
  modes_kw: 32 # retained wavenumbers in w
  mlp_ratio: 2.0 # hidden width of the channel MLP in each block, 0 disables it
  spectral_init_k0: 8.0 # scale the initial spectral weights by 1/(1+(k/k0)^2), k in grid-index units; None disables
  downsample: 4 # latent grid 1024x1024. A 256 grid leaves each block activation at tens of MB, under the resident footprint
  lift_dim: 16 # channels of the full-grid lift and projection; the blocks run at embed_dim
  resample_skip: true # add the full-grid lift features back after the upsampling: they carry the wavenumbers the latent grid cannot represent
  model_backend: 'pytorch'

  # Training config
  img_size: [4096, 4096]
  dt: 1
  global_batch_size: 1 # full-grid lift is FP32 even under BF16; batch 4 does not fit in 40 GB
  num_iters: 30000
  amp_mode: none # none or bf16; not fp16: its loss scaling cannot unscale the complex spectral weights
  enable_fused: false # fused Adam does not support the complex spectral weights
  enable_jit: false
  expdir: '/logs'
  lr_schedule: 'cosine'
  lr: 5E-4
  warmup: 0
  optimizer: 'Adam'

  # Data
  data_loader_config: 'pytorch'
  num_data_workers: 0 # number of dataloader worker threads per proc
  spatial_read_mode: 'local' # choices: local (read only this rank's tile), all (read the full image, then slice)
  n_in_channels: 2
  n_out_channels: 2
  data_path: '/data'
  stats_path: '/data/stats_trajectory.h5'
  limit_nsamples: None
  limit_nsamples_val: None

  # Comms
  wireup_info: env
  wireup_store: tcp

# limit the number of samples
short: &short_ls
  <<: *base
  limit_nsamples: 64
  limit_nsamples_val: 16
  num_iters: 400

# add optimization flags
short_opt:
  <<: *short_ls
  data_loader_config: 'pytorch'
  num_data_workers: 2
  amp_mode: bf16
  enable_jit: true
  enable_fused: false

short_opt_dali: &short_opt_dali
  <<: *short_ls
  data_loader_config: 'dali'
  num_data_workers: 2
  amp_mode: bf16
  enable_jit: true
  enable_fused: false

short_opt_dali_dp:
  <<: *short_opt_dali
  global_batch_size: 4

# The ViT short_opt_big match is embed 163 (218.2M). That forward did not fit on one GPU
# at local batch 1, so the width is 96 (75.9M). Latent grid stays 1024x1024.
short_opt_big: &short_opt_big
  <<: *short_ls
  global_batch_size: 4
  data_loader_config: 'dali'
  num_data_workers: 2
  amp_mode: bf16
  enable_jit: true
  enable_fused: false
  downsample: 4
  embed_dim: 96

# lr = 5e-4 * sqrt(16 / 4) = 1e-3.
short_opt_big_dp16:
  <<: *short_opt_big
  global_batch_size: 16
  lr: 1.0E-3

# no samples limits
opt_big: &opt_big
  <<: *short_opt_big
  limit_nsamples: None
  limit_nsamples_val: None
  num_iters: 30000

# Parameter-matched to the ViT short_mp (embed_dim 1536, depth 16, patch 16: 555.5M).
# embed 260, depth 4, modes 32x32, downsample 2: 555.1M. Latent grid 2048x2048, sharded over sp1 x sp2.
short_mp: &short_mp
  <<: *short_opt_big
  global_batch_size: 4
  num_data_workers: 2
  embed_dim: 260
  depth: 4
  downsample: 2
  data_loader_config: 'dali'
  amp_mode: bf16
  enable_jit: false
  enable_fused: false
