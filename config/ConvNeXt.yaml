base: &base
  network: 'convnext'
  model_backend: 'pytorch'
  patch_size: 32
  embed_dim: 512
  depth: 12
  kernel_size: 7
  layer_scale_init: 1.0e-6

  img_size: [4096, 4096]
  dt: 1
  global_batch_size: 4
  num_iters: 30000
  amp_mode: none
  enable_fused: false
  enable_jit: false
  expdir: '/logs'
  lr_schedule: 'cosine'
  lr: 5E-4
  warmup: 0
  optimizer: 'Adam'

  data_loader_config: 'pytorch'
  num_data_workers: 0
  spatial_read_mode: 'local'
  n_in_channels: 2
  n_out_channels: 2
  data_path: '/data'
  stats_path: '/data/stats_trajectory.h5'
  limit_nsamples: None
  limit_nsamples_val: None

  wireup_info: env
  wireup_store: tcp

short: &short
  <<: *base
  limit_nsamples: 64
  limit_nsamples_val: 16
  num_iters: 80
  data_loader_config: 'pytorch'
  num_data_workers: 0
  amp_mode: none
  enable_fused: false
  enable_jit: false

short_opt:
  <<: *short
  num_data_workers: 2
  amp_mode: bf16
  enable_fused: true
  enable_jit: true

short_opt_dali: &short_opt_dali
  <<: *short
  data_loader_config: 'dali'
  num_data_workers: 2
  amp_mode: bf16
  enable_fused: true
  enable_jit: true

# Local batch 4 on four GPUs.
short_opt_dali_dp:
  <<: *short_opt_dali
  global_batch_size: 16

# Larger model at local batch 1 on 4 GPUs.
short_opt_big: &short_opt_big
  <<: *short_opt_dali
  patch_size: 16
  embed_dim: 1024
  depth: 12
  global_batch_size: 4

# lr = 5e-4 * sqrt(16 / 4). Local batch stays 1 on 16 GPUs.
short_opt_big_dp16:
  <<: *short_opt_big
  global_batch_size: 16
  lr: 1.0E-3

# 16 GPUs: four replicas, each spatially split across four GPUs.
short_mp: &short_mp
  <<: *short_opt_big
  patch_size: 16
  embed_dim: 1536
  depth: 16
  global_batch_size: 4
  num_data_workers: 2
  enable_jit: false
